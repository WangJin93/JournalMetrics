<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JournalMetrics</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f5f5f5;
    }
    h2 {
      margin: 0 0 16px 0;
      font-size: 18px;
      color: #1a73e8;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 8px;
    }
    .option-group {
      margin-bottom: 12px;
    }
    .option-group label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      cursor: pointer;
      font-size: 14px;
      color: #333;
    }
    .option-group label:hover {
      background-color: #e8f0fe;
      padding-left: 8px;
      padding-right: 8px;
      margin-left: -8px;
      margin-right: -8px;
    }
    .option-group span {
      flex: 1;
    }
    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.3s;
      border-radius: 24px;
    }
    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }
    input:checked + .toggle-slider {
      background-color: #1a73e8;
    }
    input:focus + .toggle-slider {
      box-shadow: 0 0 1px #1a73e8;
    }
    input:checked + .toggle-slider:before {
      transform: translateX(20px);
    }
    .section-title {
      font-size: 12px;
      font-weight: bold;
      color: #1a73e8;
      margin-top: 20px;
      margin-bottom: 8px;
      padding-top: 12px;
      border-top: 2px solid #1a73e8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .section-title:first-of-type {
      margin-top: 8px;
    }
    .author-info {
      margin-top: 16px;
      padding: 12px;
      background-color: #e8f0fe;
      border-radius: 6px;
      font-size: 12px;
      color: #333;
    }
    .author-info .author-name {
      font-weight: 600;
      color: #1a73e8;
      margin-bottom: 2px;
    }
    .author-info .author-affiliation {
      color: #666;
      margin-bottom: 4px;
    }
    .author-info a {
      color: #1a73e8;
      text-decoration: none;
    }
    .author-info a:hover {
      text-decoration: underline;
    }
    .author-info .feedback-link {
      margin-top: 6px;
      display: block;
      font-weight: 500;
    }
    .footer {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #e0e0e0;
      font-size: 12px;
      color: #999;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>📊 JournalMetrics</h2>
  <p style="font-size:12px;color:#666;margin:0 0 4px 0;">PubMed 期刊影响因子分析、筛选与统计</p>
  <p style="font-size:11px;color:#999;margin:0 0 8px 0;">by Jingle Wang · 苏州大学公共卫生学院</p>
  
  <div class="section-title">Basic Info</div>
  <div class="option-group">
    <label>
      <span>Impact Factor (IF)</span>
      <div class="toggle-switch">
        <input type="checkbox" id="ifToggle">
        <span class="toggle-slider"></span>
      </div>
    </label>
  </div>
  <div class="option-group">
    <label>
      <span>JCR Quartile</span>
      <div class="toggle-switch">
        <input type="checkbox" id="jcrToggle">
        <span class="toggle-slider"></span>
      </div>
    </label>
  </div>
  <div class="option-group">
    <label>
      <span>CAS Block</span>
      <div class="toggle-switch">
        <input type="checkbox" id="casToggle">
        <span class="toggle-slider"></span>
      </div>
    </label>
  </div>
  <div class="option-group">
    <label>
      <span>Top Journal</span>
      <div class="toggle-switch">
        <input type="checkbox" id="topToggle">
        <span class="toggle-slider"></span>
      </div>
    </label>
  </div>

  <div class="section-title">Access Helper</div>
  <div class="option-group">
    <label>
      <span>Access Helper (reCAPTCHA Mirror)</span>
      <div class="toggle-switch">
        <input type="checkbox" id="accessHelperToggle">
        <span class="toggle-slider"></span>
      </div>
    </label>
  </div>

  <div class="section-title">Additional Info</div>
  <div class="option-group">
    <label>
      <span>Self-Citation Rate</span>
      <div class="toggle-switch">
        <input type="checkbox" id="selfCitationToggle">
        <span class="toggle-slider"></span>
      </div>
    </label>
  </div>
  <div class="option-group">
    <label>
      <span>Website</span>
      <div class="toggle-switch">
        <input type="checkbox" id="websiteToggle">
        <span class="toggle-slider"></span>
      </div>
    </label>
  </div>
  <div class="option-group">
    <label>
      <span>Open Access</span>
      <div class="toggle-switch">
        <input type="checkbox" id="oaToggle">
        <span class="toggle-slider"></span>
      </div>
    </label>
  </div>
  <div class="option-group">
    <label>
      <span>Publisher</span>
      <div class="toggle-switch">
        <input type="checkbox" id="publisherToggle">
        <span class="toggle-slider"></span>
      </div>
    </label>
  </div>
  <div class="option-group">
    <label>
      <span>Country</span>
      <div class="toggle-switch">
        <input type="checkbox" id="countryToggle">
        <span class="toggle-slider"></span>
      </div>
    </label>
  </div>
  <div class="option-group">
    <label>
      <span>Annual Article Count</span>
      <div class="toggle-switch">
        <input type="checkbox" id="articleCountToggle">
        <span class="toggle-slider"></span>
      </div>
    </label>
  </div>
  <div class="option-group">
    <label>
      <span>Research Articles Proportion</span>
      <div class="toggle-switch">
        <input type="checkbox" id="researchProportionToggle">
        <span class="toggle-slider"></span>
      </div>
    </label>
  </div>
  <div class="option-group">
    <label>
      <span>APC</span>
      <div class="toggle-switch">
        <input type="checkbox" id="apcToggle">
        <span class="toggle-slider"></span>
      </div>
    </label>
  </div>

  <div class="author-info">
    <div class="author-name">Jingle Wang（王进）</div>
    <div class="author-affiliation">苏州大学公共卫生学院</div>
    <a href="mailto:jinwang93@suda.edu.cn">jinwang93@suda.edu.cn</a>
    <a href="https://www.jingege.wang" target="_blank" class="feedback-link">🌐 个人网站</a>
    <a href="https://www.jingege.wang/journalmetrics" target="_blank" class="feedback-link">📬 建议与反馈</a>
  </div>

  <div class="footer">
    Data source: JCR & CAS Journal Lists
  </div>

  <script src="popup.js"></script>
</body>
</html>
